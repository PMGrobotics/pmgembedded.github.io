clients:
  - title: "Startups & Product Teams"
    desc: "You have an idea and need someone to build the hardware. We cover
      PCB design, firmware, and mechanics, so you don't need to hire three
      separate specialists for one product."
  - title: "Engineering Teams"
    desc: "Your team has the product defined but needs specific engineering
      work done. PCB layout, firmware for a particular subsystem, bring-up
      support, or a complete module handed off."
  - title: "Companies & Partners"
    desc: "Established companies that need a technical partner for a specific
      project or ongoing work. We take ownership of the hardware scope so
      your team stays focused on the rest."

