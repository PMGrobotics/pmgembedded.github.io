  title: Power Management Unit
  client: Paul Kang
  category: PCB Design & Embedded Programming
  thumbnail: "images/projects/paul-kang/thumbs/tst.png"
  summary: "Intelligent power management unit with STM32 supervision for the QA Maestro platform."
  description: |
    The QA Maestro PMU is the power backbone of the QA Maestro test platform,
    managing 12 V system input and generating regulated 3.3 V rails for the
    platform's digital subsystems.

    An STM32 microcontroller acts as the system supervisor: sequencing power
    rails on startup, monitoring supply voltages, and providing a firmware-
    controlled reset and enable interface exposed through a header connector.
    Two independently regulated 3.3 V outputs allow separation of system and load power domains. 

    A USB port enables in-field firmware updates and debug communication
    without disassembling the unit. Boot and reset controls are accessible
    via onboard switches.
