- id: mini-asrs
  hidden: false
  title: Mini-load ASRS for Small Parts Sorting
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/mini_asrs_thumb_v2.png"
  summary: "Automated storage and retrieval system for sorting small parts using AprilTag vision and a custom parallel gripper."
  description: |
    Design and development of a mini automated storage and retrieval system
    for handling and sorting small parts — screws, nuts, and washers — stored
    in standardized boxes. A fully functional prototype was built and validated.

    Boxes are identified using AprilTags detected by an IDS industrial camera
    mounted on a custom-designed positioning bracket. A parallel EGB gripper
    with custom-designed fingers picks and separates individual boxes across
    X, Y, and Z axes driven by linear actuators on an aluminum and 3D-printed
    frame structure.

    A dual-stage Z-axis was developed to handle both primary box positioning
    and a secondary 50 mm actuator stage for vertical gripper compliance during
    extraction. A dedicated separation mechanism allows one box to be extracted
    while adjacent boxes are actively restrained by auxiliary fingers, enabling
    reliable operation in high-density storage configurations. All custom metal
    and polymer components were designed in Fusion 360 and fabricated for
    prototype assembly and validation.
