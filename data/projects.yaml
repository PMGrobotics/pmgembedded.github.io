- id: lorawan-energy-meter
  hidden: false
  title: LoRaWAN Energy Meter
  client: Jan Kerkel
  category: PCB Design & Embedded Programming
  thumbnail: "images/projects/jan-kerkel/thumbs/lorawan_top-rmbg.png"
  summary: "Low-power energy meter with LoRaWAN wireless connectivity for remote monitoring."
  description: |
    A LoRaWAN-connected energy meter designed for mass production and
    residential deployment, enabling real-time remote monitoring of household
    electricity consumption without any local network infrastructure.

    The device attaches directly to an existing utility meter via magnets, with
    no tools, no wiring. It reads meter data through a galvanically isolated
    interface and transmits readings to a cloud server over the LoRaWAN network,
    where end users access live consumption data and usage history through a
    dedicated mobile application.

    The design is built around the STM32WLE5 SoC, which integrates an Arm
    Cortex-M4 processor and a LoRa radio in a single chip, minimizing board
    area and current draw. Power is supplied by a standard AA LiSOCl2 primary
    cell with a target battery life exceeding 10 years under normal operation.
    The battery is user-replaceable without tools.
