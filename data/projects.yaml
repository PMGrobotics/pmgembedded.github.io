- id: cable-drive-motion
  hidden: false
  title: Cable-Drive Motion System for Vision
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/cable_drive_thumb.png"
  summary: "Compact cable-driven camera positioning system with AprilTag-based feedback, built as a functional prototype."
  description: |
    Concept and prototype of a cable-driven motion system for camera positioning,
    developed as a mini test platform mounted on an existing warehouse machine.
    The goal was to validate mechanical architecture, sensing concepts, and control
    strategies before scaling to a larger system capable of handling heavy loads.

    Four stepper motors each drive an individual cable drum. A combination of fixed
    and double movable pulleys enables smooth cable winding regardless of camera
    position or cable angle. Vision-based position feedback is provided by cameras
    observing AprilTag-marked rotating rings mounted on each drum, eliminating the
    need for encoder hardware on the drums themselves.

    All custom components were designed for additive manufacturing in Fusion 360,
    with material selection based on function — 3D-printed polymer for complex
    geometries, stainless steel for high-load double-pulley brackets, and an
    aluminum base plate for structural rigidity. Power and control electronics,
    including motor drivers, Raspberry Pi, and a 12 V battery system, are fully
    self-contained. Full manufacturing documentation was produced: CAD assemblies,
    production files, BOM, and assembly instructions.
  images:
