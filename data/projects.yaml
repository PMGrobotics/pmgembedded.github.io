- id: cable-drive-motion
  hidden: false
  title: Cable-Drive Motion System for Vision
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/cable_drive_thumb.png"
  summary: "Compact cable-driven camera positioning system with AprilTag-based feedback, built as a functional prototype."
  description: |
    Concept and prototype of a cable-driven motion system for camera
    positioning, developed as a mini test platform to validate mechanical
    architecture and control strategies before scaling to a larger system.

    Four stepper motors drive individual cable drums. Fixed and double movable
    pulleys enable smooth cable winding regardless of camera position. Vision
    feedback is provided by cameras observing rotating rings with AprilTags
    mounted on each drum.

    All custom parts were designed for additive manufacturing — 3D-printed
    polymer for complex geometries, stainless steel for high-load brackets,
    and aluminum base plate for structural rigidity. Electronics including
    motor drivers, Raspberry Pi, and a 12V battery system are fully
    self-contained.
