- id: smart-lock-keivan
  hidden: false
  title: Smart Lock - NB-IoT Bike Lock System
  client: Bikely
  category: PCB Design & Embedded Programming
  thumbnail: "images/projects/smart-lock-keivan/thumbs/main_image.png"
  summary: "Ultra-low-power IoT bike lock with NB-IoT connectivity and remote control."
  description: |
    A compact, highly integrated electronic locking system developed for
    IoT-enabled bicycle security. The design combines NB-IoT connectivity,
    precision motor control, and environmental sensing into a rugged, battery-
    efficient package sized for tight mechanical integration.

    Connectivity is handled by a Quectel BG95-M2 NB-IoT module with a ceramic
    antenna precisely matched by an external RF lab, supporting full OTA firmware
    updates. The STM32L071 MCU was selected for its ultra-low active and standby
    current, extended by a TPS63070 buck-boost converter generating a stable 3.5 V
    system rail and a dedicated 6 V motor rail. The DRV8210 motor driver provides
    configurable current limiting for reliable lock/unlock actuation.

    Lock position feedback is provided by dual limit switches and a photo sensor
    with filtered inputs and careful grounding for noise immunity. 
    
    NB-IoT connectivity is achieved using eSIM as primary and nano SIM as secondary SIM.
    An RGB status LED and UART debug port are provided for diagnostics and field service.
  images:
