  summary: "8-layer SoM based on the NXP MPC8313E PowerQUICC II Pro, with dual Gigabit Ethernet, PCIe, USB 2.0, and impedance-controlled DDR2 routing."

  description: |
    A custom System-on-Module built around the NXP MPC8313E PowerQUICC II Pro
    processor, designed for demanding embedded Linux applications including
    networking appliances, industrial gateways, and data acquisition platforms.

    The module features dual RGMII Gigabit Ethernet with differential pair tuning
    and isolation, PCIe and USB 2.0 with impedance-controlled differential routing,
    and a high-density DDR2 memory interface with full length matching across an
    8-layer stackup. A sequenced multi-rail power tree delivers 1.0 V, 1.8 V,
