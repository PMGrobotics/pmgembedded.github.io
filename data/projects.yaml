- id: usb-hub
  hidden: false
  title: High-Speed USB 3.1 Gen1 Hub
  client: Alterra
  category: PCB Design
  thumbnail: "images/projects/liam-burns/thumbs/tst_500.png"
  summary: "2-port USB 3.1 Gen1 hub with per-port overcurrent protection and 5 Gbps signal-integrity-optimized layout for industrial integration."

  description: |
    A custom 2-port USB hub built around the Microchip USB5744 controller,
    supporting simultaneous 2 USB 3.1 Gen1 (5 Gbps) operation.
    Designed for integration into industrial and consumer electronics where
    signal integrity, power stability, and compact layout are critical.

    High-speed differential pairs (SSRX, SSTX) are routed with strict impedance
    control, minimal stub length, and careful via placement to support full 5 Gbps
    throughput. ESD protection is provided on all upstream and downstream connectors.
    Precision clocking is handled by a 25 MHz low-jitter crystal oscillator.

    Power delivery uses a multi-stage conversion (DC-DC buck + LDO) to generate
    stable 1.2 V and 3.3 V rails from a single DC input. Per-port power switching
    is managed by dual MIC2019 controllers with current limiting, fault detection,
    and individual control signals. Bootstrap and SPI access allow custom
    configuration and production test access.
  images:
    - "images/projects/liam-burns/tst_500.png"
  tags:
    - PCB Design
    - USB 3.1
    - Signal Integrity
    - Power Management
    - Microchip USB5744
    - Industrial
  specs:
    - { key: "Controller",   value: "Microchip USB5744" }
    - { key: "USB standard", value: "USB 3.1 Gen1 (5 Gbps) + USB 2.0" }
    - { key: "Ports",        value: "4× downstream (2 with full SS routing)" }
    - { key: "Power switch", value: "Dual MIC2019 (per-port, overcurrent protected)" }
