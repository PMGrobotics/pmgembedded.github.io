- id: am1808-som
  hidden: false
  title: AM1808 SoM – High-Performance System-on-Module Design
  client: Rabbit Hole Computing
  category: PCB Design
  thumbnail: "images/projects/alex-peres/thumbs/am1808_trans.png"
  summary: "High-density SoM built around the TI AM1808 ARM9, integrating DDR2 memory, sequenced power rails, and industrial interfaces for embedded Linux applications."
  description: |
    A custom System-on-Module built around the Texas Instruments AM1808 Sitara
    ARM9 processor, designed for scalable embedded Linux applications including
    HMI panels, data acquisition systems, and industrial gateways.

    The module integrates DDR2 memory with tightly length-matched, impedance-
    controlled routing, a custom PMIC with sequenced power rails (1.2 V core,
    1.8 V I/O, 3.3 V digital/analog), and a full suite of industrial interfaces —
    MII Ethernet with PHY-ready layout, USB Host/Device, SATA, LCD, JTAG, and
    UART debug ports.

    Boot flexibility is provided through a configurable bootstrap resistor network
    supporting SPI, SD, and UART boot modes, with EEPROM and SPI flash for
    bootloader and persistent storage. Designed to plug into a custom carrier
    board, it delivers a fully validated compute core without requiring customers
    to redesign the CPU subsystem from scratch.
  images:
    - "images/projects/alex-peres/am1808_trans.png"
  tags:
