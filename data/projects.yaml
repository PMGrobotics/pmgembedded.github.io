- id: mini-asrs
  hidden: false
  title: Mini-load ASRS for Small Parts Sorting
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/mini_asrs_thumb_v2.png"
  summary: "Automated storage and retrieval system for sorting small parts using AprilTag vision and a custom parallel gripper."
  description: |
    Design and development of a mini automated storage and retrieval system
    (ASRS) for handling and sorting small parts — screws, nuts, washers —
    stored in standardized boxes.

    Boxes are identified using AprilTags detected by an IDS industrial camera.
    A custom parallel gripper with designed fingers picks and separates boxes
    automatically across X, Y, and Z axes driven by linear actuators.

    A dual-stage Z-axis was developed — main Z motion for box positioning and
    a secondary 50 mm actuator for vertical gripper compliance. A separation
    mechanism allows one box to be extracted while adjacent boxes are restrained
    by auxiliary fingers. A fully functional prototype was built and validated.
  images:
