- id: sagitta
  hidden: false
  title: Sagitta
  client: Arcsec
  category: Firmware Development
  thumbnail: "images/projects/arcsec/thumbs/sagitta.png"
  summary: "Firmware development for Arcsec's high-precision star tracker used in satellite attitude determination."
  description: |
    Sagitta is Arcsec's standard star tracker for precise attitude determination
    in CubeSat and small satellite applications. PMG Embedded collaborated with
    the Arcsec team on the embedded firmware for this flight-heritage space
    hardware.

    The firmware handles optical image acquisition from a dedicated sensor, runs
    custom star-pattern matching algorithms optimized for accuracy, robustness,
    and low computational cost, and outputs quaternion attitude data to the
    satellite's on-board computer via RS485. An integrated baffle reduces stray
    light interference, supporting the tracker's 2 arcsec (1σ) cross-boresight
    accuracy — all within the tight power and thermal constraints of a CubeSat
    mission.
