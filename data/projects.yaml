- id: signal-integrity-and-emi-emc
  hidden: false
  title: Signal Integrity & EMI/EMC Analysis
  client: PMG Embedded
  category: Simulation & Analysis
  thumbnail: "images/projects/signal-integrity-and-emi-emc/thumbs/eye_1.png"
  summary: "Signal integrity simulation and pre-compliance EMI/EMC analysis for high-speed differential interfaces up to 10+ Gbps."
  description: |
    We help clients ensure signal reliability and electromagnetic compliance in
    complex, high-speed designs. Whether preparing for certification or
    troubleshooting critical issues before they reach production.

    Our signal integrity work covers TDR analysis for impedance matching and
    discontinuity detection, eye diagram simulation with extracted post-layout
    parasitics, and S-parameter characterization up to 10+ GHz for differential
    and single-ended pairs. 3D crosstalk analysis identifies which adjacent nets
    are most affected, with near-end and far-end coupling visualized separately
    to guide layout optimization.

    On the EMC side, we perform near-field E and H-field measurements 2-3 mm above
    the PCB surface to identify emission hotspots at fundamental and harmonic
    frequencies, as well as far-field analysis at 1 m distance for pre-compliance
    evaluation against CISPR and FCC standards. We also provide design reviews
    covering stackup, grounding strategy, return path management, and differential
    routing best practices.

    Well suited for designs involving USB 3.x, PCIe, DDR/LPDDR, HDMI, and
    Ethernet. Tools used include Ansys, HyperLynx, and LTspice, combined with
    custom TDR and emissions test setups.
  images:
    - "images/projects/signal-integrity-and-emi-emc/eye_1.png"
    - "images/projects/signal-integrity-and-emi-emc/pcb_2.png"
    - "images/projects/signal-integrity-and-emi-emc/waveform_2.png"
    - "images/projects/signal-integrity-and-emi-emc/waveform_3.png"
    - "images/projects/signal-integrity-and-emi-emc/waveform_5.png"
  tags:
    - Signal Integrity
    - EMI/EMC
    - TDR Analysis
    - Eye Diagram
    - Pre-Compliance
    - High-Speed Design
  specs:
