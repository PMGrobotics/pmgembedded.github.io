- id: iot-sensor-node
  hidden: false
  title: Multi-Sensor IoT Node
  client: Carl Wilhite
  category: PCB Design & Embedded Programming
  thumbnail: "images/projects/carl-wilhite/thumbs/top.png"
  summary: "Coin-cell powered BLE sensor node built on STM32WB, integrating gyroscope, pressure, and temperature sensing for ultra-low-power remote monitoring."
  description: |
    A miniaturized BLE sensor node designed for extended battery life on a
    single CR3032 coin cell. The board integrates three sensors. A MEMS
    gyroscope, a barometric pressure sensor, and a temperature sensor. They are all
    fitted onto a compact, low-profile PCB optimized for minimum current draw
    across the full sensor and radio chain.

    At the heart of the design is an STM32WB microcontroller, a dual-core
    Arm Cortex-M4/M0+ SoC from ST's Wireless family with an integrated BLE
    radio. This eliminates the need for an external radio module, reducing
    both board area and power consumption. The MCU manages sensor polling,
    data aggregation, and BLE transmission while spending the vast majority
    of its time in deep sleep, preserving the coin-cell budget over extended
    deployments.

    PMG Embedded handled schematic capture, component selection, PCB layout,
    and firmware.
  images:
