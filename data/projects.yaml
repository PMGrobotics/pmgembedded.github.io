- id: Lift
  hidden: false
  title: Precision Lifting Table
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/lift_thumb_image.png"
  summary: "Ball screw lifting table with ±1 mm accuracy, integrated onto an autonomous warehouse robot for vertical material handling."

  description: |
    A precision lifting table designed and integrated onto an autonomous warehouse
    robot, enabling accurate vertical positioning for material handling operations
    in high-throughput logistics environments.

    The mechanical system is built around a ball screw drive with linear guide
    rails, delivering reliable ±1 mm positioning accuracy under load. Full
    drivetrain component selection was performed in-house, stepper motor with
    brake, ball screw, linear blocks, and couplings, with all sizing calculations
    validated before procurement.

    Complete 3D CAD models, assemblies, and manufacturing drawings were created in
    Autodesk Inventor. Custom-machined parts were sourced and coordinated with
    external manufacturers, followed by full mechanical assembly and system
    integration including wiring. Test firmware written in embedded C was developed
    to verify stepper motor control and validate motion accuracy before deployment
    on the robot platform.
