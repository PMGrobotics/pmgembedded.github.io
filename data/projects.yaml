  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/robotics_platform_1.png"
  summary: "Modular mobile platform integrating two UR10 manipulators on a mecanum-wheel base with deployable stabilizers."
  description: |
    A modular mobile robotic platform integrating two UR10 manipulators on a
    Vention aluminum-frame structure with mecanum-wheel mobility, developed for
    flexible industrial and R&D applications requiring precise manipulation and
    high configurability.

    The complete mechanical architecture was designed in Autodesk Inventor using
    the Vention MachineBuilder environment, covering the full integration layout
    for both UR10 arms. Custom laser-cut mounting plates, actuator brackets,
    mecanum-wheel holders, and 3D-printed camera mounts were developed alongside
    a preassembled mecanum-wheel drive module integrated into the chassis.

    Four Firgelli linear actuators serve as deployable stabilizers, extending
    outward during manipulation to counteract dynamic loads from dual-arm
    operation. Component selection, mechanical sizing, and structural layout were
    validated for the combined load envelope of two UR10 arms at full extension.
    Manufacturing drawings and documentation were produced for CNC fabrication
    and assembly.
