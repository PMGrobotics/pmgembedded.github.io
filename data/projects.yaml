- id: cnc-vise-automation
  hidden: false
  title: Concept Automation System for CNC Vise
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/cnc_vise_thumb_v2.png"
  summary: "Concept-level robotic automation system for CNC vise loading, zero positioning, and torque-controlled clamping."
  description: |
    Concept-level automation project for automating workpiece zero positioning
    and clamping inside a CNC vise, enabling robotic loading with automated
    CNC machine operation.

    The system uses a collaborative robot (xArm 6) mounted on linear guide
    rails driven by a NEMA23 stepper and ball screw. An Intel RealSense D435i
    with AprilTag markers provides vision-based positioning on the worktable,
    workpiece holders, and vise jaws.

    Automated clamping uses linear actuators with a stepper-driven tightening
    mechanism and integrated torque sensor for controlled clamping force.
    Full feasibility analysis, spatial constraint evaluation, and automation
    logic were developed for CNC integration.
