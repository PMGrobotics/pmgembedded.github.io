- id: jetson-carrier-board
  hidden: false
  title: Jetson Xavier NX Carrier Board – High-Density Embedded AI Platform
  client: Lincon Cavalieri
  category: PCB Design
  thumbnail: "images/projects/lincon-cavalieri/thumbs/main_image_v2.png"
  summary: "High-density custom carrier board for the NVIDIA Jetson Xavier NX AI compute module."
  description: |
    A compact, high-density carrier board designed to host the NVIDIA Jetson Xavier
    NX system-on-module, targeting edge AI, robotics, machine vision, and industrial
    automation applications.

    The board breaks out the module's high-speed interfaces across a 6-layer
    impedance-controlled stackup — PCIe Gen3 x4 with tight skew control, dual
    USB 3.1 and USB 2.0 with differential routing, HDMI with full TMDS compliance
    and hot-plug detection, and MIPI CSI camera lanes with shielded, noise-isolated
    routing. An M.2 Key-E slot supports Wi-Fi/BT modules via SDIO, PCIe, and UART.

    A multistage power sequencing system (Using TI MCU) manages 
    1.8 V, 3.3 V, and 5 V rails with synchronized enable signals and reset 
    logic for both the module and all peripherals. Expansion headers expose 
    I²C, SPI, UART, CAN, and GPIO for application-specific integration.
