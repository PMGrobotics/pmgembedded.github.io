- id: cnc-vise-automation
  hidden: false
  title: Concept Automation System for CNC Vise
  client: Apsara
  category: Mechanical Design
  thumbnail: "images/projects/apsara/thumbs/cnc_vise_thumb_v2.png"
  summary: "Concept-level robotic automation system for CNC vise loading, zero positioning, and torque-controlled clamping."
  description: |
    Concept-level automation system for robotic workpiece loading, zero positioning,
    and clamping inside a CNC vise, enabling automated CNC machine operation without
    manual intervention.

    The robotic handling strategy uses a UFACTORY xArm 6 collaborative manipulator
    mounted on linear guide rails driven by a NEMA23 stepper motor and ball screw,
    extending the robot's working envelope to cover the full CNC worktable. Vision-
    based positioning is provided by an Intel RealSense D435i with AprilTag markers
    placed on the worktable, workpiece holders, and vise jaws — giving the system
    a reference frame for accurate part placement without dedicated fixturing.

    Automated clamping uses a stepper-driven tightening mechanism with an integrated
    torque sensor mounted on the motor shaft, enabling controlled and repeatable
    clamping force. Full feasibility analysis was performed covering spatial
    constraints, tolerance stack-up, and automation logic for CNC integration.
